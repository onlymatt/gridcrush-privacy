
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Privacy Policy for GRIDCRUSH - Block Puzzle, available in English and Italian.">
  <meta name="robots" content="index, follow">
  <title>Privacy Policy | GRIDCRUSH</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(
        ellipse at top,
        #243c69 0%,
        #111c35 45%,
        #0a1225 100%
      );
      color: #f5f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      background: rgba(22, 35, 61, 0.94);
      border: 1px solid #3a4b71;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: grid;
      grid-template-columns: repeat(3, 16px);
      gap: 5px;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .block {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .blue { background: #5b9eff; }
    .cyan { background: #52d8f0; }
    .yellow { background: #ffcc58; }
    .purple { background: #a38bff; }
    .green { background: #5fe1a1; }

    h1 {
      font-size: clamp(30px, 6vw, 40px);
      letter-spacing: 2px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #aabbd7;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .description {
      color: #bac8df;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .language-links {
      display: grid;
      gap: 14px;
    }

    .language-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #ffffff;
      background: #263a62;
      border: 1px solid #4a6391;
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .language-link:hover {
      background: #345184;
      transform: translateY(-2px);
    }

    .language-link:focus-visible {
      outline: 3px solid #79b8ff;
      outline-offset: 3px;
    }

    .arrow {
      color: #8ebcff;
      font-size: 22px;
    }

    footer {
      text-align: center;
      color: #90a2c1;
      font-size: 13px;
      margin-top: 26px;
      line-height: 1.8;
    }

    footer a {
      color: #b4d2ff;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      main {
        padding: 32px 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo" aria-hidden="true">
      <div class="block blue"></div>
      <div class="block cyan"></div>
      <div class="block yellow"></div>
      <div class="block purple"></div>
      <div class="block green"></div>
      <div class="block blue"></div>
      <div class="block yellow"></div>
      <div class="block purple"></div>
      <div class="block cyan"></div>
    </div>

    <h1>GRIDCRUSH</h1>
    <div class="subtitle">Block Puzzle</div>

    <h2>Privacy Policy</h2>

    <p class="description">
      Choose your preferred language to read the
      GRIDCRUSH privacy policy.
      <br>
      Seleziona la lingua in cui desideri consultare
      l'informativa sulla privacy.
    </p>

    <nav class="language-links" aria-label="Privacy policy languages">
      <a class="language-link" href="privacy-en.html" lang="en">
        <span>English</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a class="language-link" href="privacy-it.html" lang="it">
        <span>Italiano</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </main>

  <footer>
    <div>GRIDCRUSH - Block Puzzle</div>
    <div>Developed by onlymt</div>
    <div>Contact: <a href="mailto:onlymt.st@gmail.com">
      onlymt.st@gmail.com
    </a></div>
  </footer>
</body>
</html>
